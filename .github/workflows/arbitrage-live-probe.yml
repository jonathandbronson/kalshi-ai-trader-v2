name: Arbitrage live public API probe
on:
  workflow_dispatch:
  push:
    branches: [arbitrage-v1]
    paths:
      - 'arbitrage/live-probe.js'
      - '.github/workflows/arbitrage-live-probe.yml'
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probe live public orderbooks (no orders)
        run: node arbitrage/live-probe.js
      - name: Publish latest probe directly to repository
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = 'reports/latest-probe.json';
            const data = fs.existsSync('arbitrage-probe.json')
              ? fs.readFileSync('arbitrage-probe.json','utf8')
              : JSON.stringify({timestamp:new Date().toISOString(),status:'PROBE_FAILED',runId:context.runId},null,2);
            let sha;
            try {
              const existing = await github.rest.repos.getContent({...context.repo,path,ref:'arbitrage-v1'});
              sha = existing.data.sha;
            } catch(e) { if(e.status !== 404) throw e; }
            await github.rest.repos.createOrUpdateFileContents({
              ...context.repo,path,branch:'arbitrage-v1',
              message:'Update latest arbitrage API probe [skip ci]',
              content:Buffer.from(data).toString('base64'),
              ...(sha?{sha}:{})
            });
      - name: Upload diagnostic report even on error
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arbitrage-live-probe
          path: arbitrage-probe.json
          if-no-files-found: warn
