name: Arbitrage tests
on:
  push:
    branches: [arbitrage-v1]
  pull_request:
    branches: [arbitrage-v1]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: node --test arbitrage/*.test.js
