name: Discovery V2 shadow benchmark
on:
  workflow_dispatch:
  push:
    branches: [discovery-v2]
    paths:
      - 'arbitrage/discovery-v2.js'
      - 'arbitrage/discovery-v2-cli.js'
      - 'arbitrage/discovery-v2.test.js'
      - 'arbitrage/discovery-v2-comparison-cli.js'
      - '.github/workflows/discovery-v2.yml'
jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate V2 syntax and behavior
        run: |
          node --check arbitrage/discovery-v2.js
          node --check arbitrage/discovery-v2-cli.js
          node --check arbitrage/discovery-v2-comparison-cli.js
          node --test arbitrage/discovery-v2.test.js
      - name: Restore prior incremental market snapshot
        uses: actions/cache/restore@v4
        with:
          path: arbitrage-v2-market-snapshot.json
          key: discovery-v2-snapshot-${{ github.run_id }}
          restore-keys: |
            discovery-v2-snapshot-
      - name: Run independent shadow discovery
        run: node arbitrage/discovery-v2-cli.js
      - name: Compare V1 and V2 on the same market snapshot
        run: node arbitrage/discovery-v2-comparison-cli.js
      - name: Persist incremental market snapshot
        if: success()
        uses: actions/cache/save@v4
        with:
          path: arbitrage-v2-market-snapshot.json
          key: discovery-v2-snapshot-${{ github.run_id }}
      - name: Retain reports and snapshot as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: discovery-v2-shadow
          path: |
            arbitrage-discovery-v2.json
            arbitrage-v2-market-snapshot.json
            arbitrage-v2-human-review-sample.json
            arbitrage-v2-same-snapshot-comparison.json
          if-no-files-found: warn
          retention-days: 14
