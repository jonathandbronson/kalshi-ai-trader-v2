name: Arbitrage candidate discovery
# Manual scan request: validate dual-channel candidate discovery on 2026-10-21.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [arbitrage-v1]
    paths:
      - 'arbitrage/candidate-discovery.js'
      - 'arbitrage/event-discovery.js'
      - 'arbitrage/event-changes.js'
      - 'arbitrage/simulator.js'
      - 'arbitrage/simulator.test.js'
      - 'arbitrage/fixtures.js'
      - 'arbitrage/paper-live-engine.js'
      - 'arbitrage/paper-live-engine.test.js'
      - 'arbitrage/spread-observer.js'
      - 'arbitrage/spread-observer.test.js'
      - 'arbitrage/spread-observer-cli.js'
      - 'arbitrage/approved-pairs.json'
      - 'arbitrage/category-sources.js'
      - 'arbitrage/category-sources.test.js'
      - 'arbitrage/review-queue.js'
      - 'arbitrage/review-queue.test.js'
      - 'arbitrage/review-queue-cli.js'
      - 'arbitrage/market-matcher.js'
      - 'arbitrage/market-matcher.test.js'
      - 'arbitrage/rule-evidence.js'
      - 'arbitrage/rule-evidence.test.js'
      - 'arbitrage/rejection-policy.js'
      - 'arbitrage/evidence-refresh.js'
      - 'arbitrage/evidence-refresh.test.js'
      - 'arbitrage/evidence-refresh-cli.js'
      - 'arbitrage/discovery-benchmark.js'
      - 'arbitrage/discovery-benchmark.test.js'
      - 'arbitrage/review-dashboard-cli.js'
      - 'arbitrage/discovery-benchmark-cli.js'
      - 'arbitrage/pair-registry.js'
      - 'arbitrage/pair-registry-cli.js'
      - 'arbitrage/pair-registry.test.js'
      - 'arbitrage/manual-reviews.json'
      - 'arbitrage/spread-history.js'
      - 'arbitrage/spread-history-cli.js'
      - 'arbitrage/candidate-history.js'
      - 'arbitrage/candidate-history-cli.js'
      - 'arbitrage/candidate-history.test.js'
      - 'arbitrage/coverage-history.js'
      - 'arbitrage/coverage-history-cli.js'
      - 'arbitrage/coverage-history.test.js'
      - 'arbitrage/quality-gates.js'
      - 'arbitrage/quality-gates.test.js'
      - 'arbitrage/quality-feedback.js'
      - 'arbitrage/ground-truth.json'
      - 'arbitrage/settlement-triage.js'
      - 'arbitrage/settlement-triage.test.js'
      - 'arbitrage/semantic-retrieval.js'
      - 'arbitrage/semantic-retrieval.test.js'
      - 'arbitrage/contract-extraction.js'
      - 'arbitrage/neural-embedding-provider.js'
      - 'arbitrage/ai-settlement-review.js'
      - 'arbitrage/ai-discovery.test.js'
      - 'arbitrage/labeled-discovery-benchmark-cli.js'
      - '.github/workflows/arbitrage-candidates.yml'
jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: arbitrage-candidate-report
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check scanner syntax before collection
        run: |
          node --check arbitrage/candidate-discovery.js
          node --check arbitrage/event-discovery.js
          node --check arbitrage/event-changes.js
          node --check arbitrage/market-matcher.js
          node --check arbitrage/quality-gates.js
          node --check arbitrage/quality-feedback.js
          node --check arbitrage/settlement-triage.js
          node --check arbitrage/semantic-retrieval.js
          node --check arbitrage/contract-extraction.js
          node --check arbitrage/neural-embedding-provider.js
          node --check arbitrage/ai-settlement-review.js
          node --check arbitrage/labeled-discovery-benchmark-cli.js
          node --check arbitrage/evidence-refresh.js
          node --test arbitrage/*.test.js
      - name: Publish synthetic discovery benchmark
        run: node arbitrage/discovery-benchmark-cli.js
      - name: Collect and score candidate markets (read only)
        run: node arbitrage/candidate-discovery.js
      - name: Discover event-first candidate pairs (read only)
        run: node arbitrage/event-discovery.js
      - name: Measure real labeled retrieval precision and recall
        if: success()
        run: node arbitrage/labeled-discovery-benchmark-cli.js
      - name: Accumulate 30-day discovery coverage telemetry
        if: success()
        run: node arbitrage/coverage-history-cli.js
      - name: Accumulate 30-day candidate discovery history
        if: success()
        run: node arbitrage/candidate-history-cli.js
      - name: Build diversified manual settlement review queue
        if: success()
        run: node arbitrage/review-queue-cli.js
      - name: Refresh current official contract rules for manual review
        if: success()
        run: node arbitrage/evidence-refresh-cli.js
      - name: Update persistent verified-pair registry
        if: success()
        run: node arbitrage/pair-registry-cli.js
      - name: Render manual settlement review dashboard
        if: success()
        run: node arbitrage/review-dashboard-cli.js
      - name: Observe spreads on manually verified watchlist (read only)
        if: success()
        run: node arbitrage/spread-observer-cli.js
      - name: Accumulate seven-day spread observation history
        if: success()
        run: node arbitrage/spread-history-cli.js
      - name: Compare new event candidates with previous report
        if: success()
        run: node arbitrage/event-changes.js
      - name: Publish latest report into repository for direct retrieval
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = 'reports/latest-candidates.json';
            let report;
            if (fs.existsSync('arbitrage-candidates.json')) {
              report = fs.readFileSync('arbitrage-candidates.json','utf8');
            } else {
              report = JSON.stringify({
                timestamp: new Date().toISOString(),
                status: 'COLLECTOR_FAILED',
                runId: context.runId,
                message: 'No report generated; inspect workflow logs'
              },null,2);
            }
            async function publish(path,body) {
              const content = Buffer.from(body).toString('base64');
              let sha;
              try {
                const existing = await github.rest.repos.getContent({
                  ...context.repo, path, ref: 'arbitrage-v1'
                });
                sha = existing.data.sha;
              } catch(e) {
                if(e.status !== 404) throw e;
              }
              await github.rest.repos.createOrUpdateFileContents({
                ...context.repo, path, branch: 'arbitrage-v1',
                message: 'Update automated discovery report [skip ci]',
                content, ...(sha ? {sha} : {})
              });
            }
            await publish(path,report);
            const eventPath = 'reports/latest-events.json';
            const eventReport = fs.existsSync('arbitrage-events.json')
              ? fs.readFileSync('arbitrage-events.json','utf8')
              : JSON.stringify({timestamp:new Date().toISOString(),status:'EVENT_COLLECTOR_FAILED',runId:context.runId});
            if (fs.existsSync('arbitrage-events.json')) {
              await publish(eventPath,eventReport);
            } else {
              await publish('reports/latest-event-failure.json',eventReport);
            }
            if (fs.existsSync('arbitrage-coverage-history.json')) {
              await publish('reports/latest-coverage-history.json',fs.readFileSync('arbitrage-coverage-history.json','utf8'));
            }
            if (fs.existsSync('arbitrage-candidate-history.json')) {
              await publish('reports/latest-candidate-history.json',fs.readFileSync('arbitrage-candidate-history.json','utf8'));
            }
            if (fs.existsSync('arbitrage-pair-registry.json')) {
              await publish('reports/latest-pair-registry.json',fs.readFileSync('arbitrage-pair-registry.json','utf8'));
            }
            if (fs.existsSync('arbitrage-spread-history.json')) {
              await publish('reports/latest-spread-history.json',fs.readFileSync('arbitrage-spread-history.json','utf8'));
            }
            if (fs.existsSync('arbitrage-discovery-benchmark.json')) {
              await publish('reports/latest-discovery-benchmark.json',fs.readFileSync('arbitrage-discovery-benchmark.json','utf8'));
            }
            if (fs.existsSync('arbitrage-review-dashboard.md')) {
              await publish('reports/latest-review-dashboard.md',fs.readFileSync('arbitrage-review-dashboard.md','utf8'));
            }
            if (fs.existsSync('arbitrage-discovery-archive.json')) {
              await publish('reports/latest-discovery-archive.json',fs.readFileSync('arbitrage-discovery-archive.json','utf8'));
            }
            if (fs.existsSync('arbitrage-labeled-benchmark.json')) {
              await publish('reports/latest-labeled-benchmark.json',fs.readFileSync('arbitrage-labeled-benchmark.json','utf8'));
            }
            if (fs.existsSync('arbitrage-review-queue.json')) {
              await publish('reports/latest-review-queue.json',fs.readFileSync('arbitrage-review-queue.json','utf8'));
            }
            if (fs.existsSync('arbitrage-spread-observations.json')) {
              await publish('reports/latest-spread-observations.json',fs.readFileSync('arbitrage-spread-observations.json','utf8'));
            }
            if (fs.existsSync('arbitrage-rejected-pairs.json')) {
              await publish('reports/rejected-pairs.json',fs.readFileSync('arbitrage-rejected-pairs.json','utf8'));
            }
            if (fs.existsSync('arbitrage-event-changes.json')) {
              await publish('reports/latest-event-changes.json',fs.readFileSync('arbitrage-event-changes.json','utf8'));
            }
      - name: Save downloadable candidate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arbitrage-candidates
          path: |
            arbitrage-candidates.json
            arbitrage-events.json
            arbitrage-event-changes.json
            arbitrage-rejected-pairs.json
            arbitrage-spread-observations.json
            arbitrage-review-queue.json
            arbitrage-review-dashboard.md
            arbitrage-discovery-benchmark.json
            arbitrage-pair-registry.json
            arbitrage-spread-history.json
            arbitrage-candidate-history.json
            arbitrage-coverage-history.json
          if-no-files-found: warn
